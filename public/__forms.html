<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IKOS Luxury Developments Forms Register</title>
</head>
<body>
  <!-- This file is specifically for Netlify's build-time form detection. -->
  <form name="ikos-inquiry" data-netlify="true" hidden>
    <input type="hidden" name="form-name" value="ikos-inquiry" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <select name="budget_tier">
      <option value="5m-10m">$5,000,000 - $10,000,000</option>
      <option value="10m-20m">$10,000,000 - $20,000,000</option>
      <option value="20m-plus">$20,000,000 +</option>
    </select>
    <textarea name="architectural_intent"></textarea>
    <input type="hidden" name="selected_acreage" />
    <input type="hidden" name="selected_finish" />
    <input type="hidden" name="selected_footprint" />
  </form>
</body>
</html>
